services:
  db:
    image: postgres:17
    container_name: djhotel_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s    
    restart: always
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: djhotel_web
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - venv_data:/app/.venv
    working_dir: /app/hotelxxx
    command: uv run python manage.py runserver 0.0.0.0:8000
    



volumes:
  postgres_data:
  venv_data:
