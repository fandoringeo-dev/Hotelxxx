[project]
name = "djhotel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bandit>=1.9.4",
    "django>=6.0.4",
    "djangorestframework>=3.17.1",
    "loguru>=0.7.3",
    "make>=0.1.6.post2",
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "psycopg[binary]>=3.3.3",
    "radon>=6.0.1",
    "ruff>=0.15.12",
]

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "ipython>=9.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["hotelxxx"]
extend-exclude = [".venv", "venv", "build", "dist", "__pycache__", "migrations"]

[tool.ruff.lint]
# Набор правил: базовые ошибки/предупреждения + сортировка импортов + апгрейды и упрощения
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["hotel_core", "rooms", "bookings"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"     # "double" | "single"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
exclude = '(^|/|\\)migrations($|/|\\)'
